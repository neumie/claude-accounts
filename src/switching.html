<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Switching Claude account…</title>
<style>
:root{color-scheme:dark}
html,body{height:100%;margin:0;background:#0f1113;color:#9a9ea6;font:13px/1.5 -apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;align-items:center;justify-content:center}

</head>
<body><span class="dot"></span>Switching Claude account… this tab comes back in a moment.</body>
